name: Build
on:
  push:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MyVPN-debug-apk
          path: app/build/outputs/apk/debug/*.apk
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - working-directory: server
        run: |
          go mod tidy
          GOOS=linux GOARCH=amd64 go build -o myvpn-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o myvpn-linux-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: myvpn-server
          path: server/myvpn-linux-*
